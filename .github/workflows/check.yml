name: macOS Check
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Build universal app
        run: bash scripts/build.sh
      - name: Engine regression
        run: ruby tests/engine_test.rb
      - name: App and process checks
        run: ruby tests/app_test.rb
